pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        // VoxRT Silero VAD is only published on JitPack
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'com.github.VoxRT'
            }
        }

        flatDir {
            dirs 'libs'
        }
    }
}
include ':voiceinput-shared'
