name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # build.gradle otherwise derives these from git history/tags, which a shallow clone lacks
  VERSION_CODE: "1"
  VERSION_NAME: ci-${{ github.sha }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  # Model files (futo-swipe LFS objects, Whisper weights) are only loaded at runtime and
  # aren't needed to build or test, so leave futo-swipe files as LFS pointers
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out submodules (without models)
        run: |
          git -c submodule."voiceinput-shared/src/main/ml".update=none \
            submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build debug APK
        run: ./gradlew assembleUnstableDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testUnstableDebugUnitTest --stacktrace

      - name: Compile instrumented tests
        run: ./gradlew assembleUnstableDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/
            voiceinput-shared/build/reports/tests/
          if-no-files-found: ignore
